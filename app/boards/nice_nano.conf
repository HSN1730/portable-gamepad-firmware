CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# --- Branding -----------------------------------------------------------------
# Product name shown in the Bluetooth device list and in the USB device
# properties. Firmware appends a 4 character per-chip suffix, so the device
# shows up as e.g. "HSNIBOX IK59" (each unit gets its own suffix, which makes
# multiple controllers easy to tell apart).
#
# NOTE: the Bluetooth advertising packet only has room for 13 characters here.
# The firmware has a BUILD_ASSERT on this, so a too-long name fails the build.
CONFIG_PGF_PRODUCT_NAME="HSNIBOX"
# Manufacturer string, shown in the USB device properties ("Manufacturer") and
# in the Bluetooth Device Information Service.
CONFIG_PGF_MANUFACTURER_NAME="HSNIBOX"

# --- Battery level reporting -------------------------------------------------
# The nice!nano wires the battery to VDDH, so the on-chip VDDHDIV5 SAADC
# channel can measure it directly (see app/boards/nice_nano.overlay).
CONFIG_ADC=y
CONFIG_PGF_BATTERY_LEVEL_REPORTING_VBATT=y

# BAS 1.1 "Battery Level Status" characteristic. On Windows 11 24H2 and newer
# this lets the device decide *when* to ask the host for a low battery alert,
# instead of Windows only warning at 5%. Older hosts simply fall back to the
# BAS 1.0 behaviour.
CONFIG_BT_BAS_BLS=y
