CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETAINED_MEM_NRF_GPREGRET=y

# --- Battery level reporting -------------------------------------------------
# The nice!nano wires the battery to VDDH, so the on-chip VDDHDIV5 SAADC
# channel can measure it directly (see app/boards/nice_nano.overlay).
CONFIG_ADC=y
CONFIG_PGF_BATTERY_LEVEL_REPORTING_VBATT=y

# BAS 1.1 "Battery Level Status" characteristic. On Windows 11 24H2 and newer
# this lets the device decide *when* to ask the host for a low battery alert,
# instead of Windows only warning at 5%. Older hosts simply fall back to the
# BAS 1.0 behaviour.
CONFIG_BT_BAS_BLS=y
